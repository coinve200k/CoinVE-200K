[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsynth"
version = "2.0.4"
description = "Enjoy the magic of Diffusion models!"
authors = [{name = "ModelScope Team"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10.1"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "transformers>=4.57.0",
    "accelerate>=1.13.0",
    "peft>=0.19.0",
    "safetensors>=0.7.0",
    "imageio>=2.37.0",
    "imageio[ffmpeg]>=2.37.0",
    "einops>=0.8.0",
    "sentencepiece>=0.2.0",
    "protobuf>=7.0.0",
    "modelscope>=1.36.0",
    "ftfy>=6.3.0",
    "pandas>=2.0.0",
    "opencv-python>=4.10.0",
    "datasets>=2.20.0",
    "numpy>=2.0.0",
    "Pillow>=11.0.0",
    "PyYAML>=6.0.0",
    "tqdm>=4.67.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["diffsynth", "diffsynth.*"]

[project.optional-dependencies]
training = [
    "wandb>=0.26.0",
    "deepspeed>=0.18.0",
]
bench = [
    "boto3>=1.40.0",
]
npu_aarch64 = [
    "torch==2.7.1",
    "torch-npu==2.7.1",
    "torchvision==0.22.1"
]
npu = [
    "torch==2.7.1+cpu",
    "torch-npu==2.7.1",
    "torchvision==0.22.1+cpu"
]

[tool.setuptools]
include-package-data = true
